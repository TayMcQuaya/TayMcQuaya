<!DOCTYPE html>
<!-- A picture for a project that has nothing to screenshot (a script, a command line tool).
     Open tools/card.html?id=cipherlock&type=tool&name=CipherLock&line=Lock any file with a password.&tags=AES-256,Windows .exe,Python
     in a browser at 1280x800 and save a screenshot as assets/tex/<id>.jpg -->
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family: 'Jersey Pixel'; font-weight: 700; src: url('../assets/fonts/jersey-25-latin-400-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Figtree'; font-weight: 600; src: url('../assets/fonts/figtree-latin-600-normal.woff2') format('woff2'); }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1280px; height: 800px; overflow: hidden; display: grid; grid-template-columns: 1fr 420px; gap: 56px; align-items: center;
    padding: 0 96px; color: #210b1b; font-family: 'Figtree', sans-serif; font-weight: 600; }
  h1 { font: 700 112px/0.92 'Jersey Pixel', sans-serif; }
  p { font-size: 34px; line-height: 1.3; margin-top: 28px; max-width: 15em; }
  ul { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 14px; margin-top: 40px; }
  li { font-size: 25px; padding: 9px 20px; background: #fffaf1; border: 4px solid #210b1b; }
  .pet { width: 420px; height: 420px; background: #fffaf1; border: 6px solid #210b1b; box-shadow: 16px 16px 0 #210b1b; display: grid; place-items: center; }
  .pet img { width: 320px; height: 320px; image-rendering: pixelated; }
</style>
</head>
<body>
  <div><h1 id="name"></h1><p id="line"></p><ul id="tags"></ul></div>
  <div class="pet"><img id="pet" alt=""></div>
  <script type="module">
    import { sprite } from '../js/sprite.js';
    const q = new URLSearchParams(location.search);
    const s = sprite(q.get('id'), q.get('type') || 'tool');
    document.body.style.background = s.bg;
    document.getElementById('pet').src = s.url;
    document.getElementById('name').textContent = q.get('name');
    document.getElementById('line').textContent = q.get('line');
    for (const t of (q.get('tags') || '').split(',').filter(Boolean)) document.getElementById('tags').append(Object.assign(document.createElement('li'), { textContent: t }));
    document.fonts.ready.then(() => document.body.classList.add('ready'));
  </script>
</body>
</html>
